name: Android Build & Release

on:
  push:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      arch:
        description: 'Target architecture'
        required: false
        default: 'arm64-v8a'
        type: choice
        options: [arm64-v8a, 'arm64-v8a,armeabi-v7a', 'arm64-v8a,armeabi-v7a,x86,x86_64']

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-release:
    name: Build APK & Release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      # ── 1. Checkout (shallow — no git history needed) ───────────────────────
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # ── 2. pnpm + Node ──────────────────────────────────────────────────────
      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      # ── 3. Cache node_modules (keyed on lockfile) ───────────────────────────
      - uses: actions/cache@v4
        id: pnpm-cache
        with:
          path: node_modules
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-

      - name: Install JS dependencies
        if: steps.pnpm-cache.outputs.cache-hit != 'true'
        run: pnpm install --frozen-lockfile

      # ── 4. Java 17 ──────────────────────────────────────────────────────────
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # ── 5. Cache Gradle (biggest time saver — skips all downloads) ──────────
      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            android/.gradle
          key: gradle-${{ runner.os }}-${{ hashFiles('android/gradle/wrapper/gradle-wrapper.properties', 'android/**/*.gradle*', 'android/gradle.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      # ── 6. Write .env ────────────────────────────────────────────────────────
      - name: Write .env
        run: |
          cat > .env << 'EOF'
          EXPO_PUBLIC_API_URL=${{ secrets.EXPO_PUBLIC_API_URL }}
          EXPO_PUBLIC_GROQ_API_KEY=${{ secrets.EXPO_PUBLIC_GROQ_API_KEY }}
          EXPO_PUBLIC_SENTRY_DSN=${{ secrets.EXPO_PUBLIC_SENTRY_DSN }}
          EXPO_PUBLIC_CLARITY_PROJECT_ID=${{ secrets.EXPO_PUBLIC_CLARITY_PROJECT_ID }}
          EOF

      # ── 7. Speed-up gradle.properties ───────────────────────────────────────
      - name: Tune Gradle for CI
        run: |
          cat >> android/gradle.properties << 'EOF'
          org.gradle.daemon=false
          org.gradle.configureondemand=true
          org.gradle.caching=true
          org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=512m -XX:+HeapDumpOnOutOfMemoryError
          android.enablePngCrunchInReleaseBuilds=false
          EOF

      # ── 8. Build release APK (arm64 only by default = 2-3x faster) ──────────
      - name: Build release APK
        working-directory: android
        run: |
          chmod +x gradlew
          ARCH="${{ github.event.inputs.arch || 'arm64-v8a' }}"
          echo "▶ Building for arch: $ARCH"
          ./gradlew assembleRelease \
            --no-daemon \
            --build-cache \
            --parallel \
            -PreactNativeArchitectures="$ARCH" \
            -Dorg.gradle.parallel=true

      # ── 9. Rename APK ────────────────────────────────────────────────────────
      - name: Locate & rename APK
        id: apk
        run: |
          APK=$(find android/app/build/outputs/apk/release -name "*.apk" | head -1)
          VERSION=$(node -p "require('./package.json').version")
          DEST="edurise-lms-v${VERSION}-build${{ github.run_number }}.apk"
          cp "$APK" "$DEST"
          SIZE=$(du -sh "$DEST" | cut -f1)
          echo "path=$DEST" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "size=$SIZE" >> $GITHUB_OUTPUT
          echo "✅ $DEST ($SIZE)"

      # ── 10. Upload artifact (always available even without a release) ────────
      - uses: actions/upload-artifact@v4
        with:
          name: edurise-apk-build${{ github.run_number }}
          path: ${{ steps.apk.outputs.path }}
          retention-days: 14

      # ── 11. GitHub Release ───────────────────────────────────────────────────
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.apk.outputs.version }}-build.${{ github.run_number }}
          name: "Edurise LMS v${{ steps.apk.outputs.version }} — Build #${{ github.run_number }}"
          body: |
            ## 📱 Edurise LMS Android APK

            | | |
            |---|---|
            | **Version** | `${{ steps.apk.outputs.version }}` |
            | **Build** | `#${{ github.run_number }}` |
            | **Size** | `${{ steps.apk.outputs.size }}` |
            | **Arch** | `${{ github.event.inputs.arch || 'arm64-v8a' }}` |
            | **Commit** | [`${{ github.sha }}`](${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}) |

            ### Install
            1. Download **`${{ steps.apk.outputs.path }}`** below
            2. On Android: **Settings → Install unknown apps** → allow your browser/Files app
            3. Open the APK → tap **Install**

            > Works on all Android phones (arm64) — covers 99% of modern devices
          files: ${{ steps.apk.outputs.path }}
          draft: false
          prerelease: true
